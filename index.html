    --ink: #0a0a0a;
    --crown-gold: #d9b45a;
    --light-gold: #e3bc5b;
    --bone: #f2e7cf;
    --slate-gold: #3a342a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    gap: clamp(1.5rem, 4vw, 2.5rem);
    padding: 2rem;
    text-align: center;
  }

  .crown {
    width: clamp(3.5rem, 8vw, 6rem);
    height: auto;
    opacity: 0;
    transform: translateY(0.6rem);
    animation: reveal 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: 0.05s;
  }

  h1 {
    margin: 0;
    font-family: 'Archivo', Arial, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(2.25rem, 7vw, 4.5rem);
    color: var(--bone);
    opacity: 0;
    transform: translateY(0.6rem);
    animation: reveal 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: 0.18s;
  }

  h1 .accent {
    color: var(--crown-gold);
  }

  p.utility {
    margin: 0;
    font-family: 'Space Mono', 'SFMono-Regular', Consolas, monospace;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(242, 231, 207, 0.6);
    opacity: 0;
    transform: translateY(0.6rem);
    animation: reveal 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: 0.3s;
  }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .crown, h1, p.utility {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
